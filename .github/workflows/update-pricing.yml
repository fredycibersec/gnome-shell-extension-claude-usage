name: Update pricing

on:
  schedule:
    - cron: "17 6 * * 1"     # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate src/helper/pricing.json from Anthropic's pricing page
        run: python3 tools/update_pricing.py

      - name: Commit if prices changed
        run: |
          if git diff --quiet -- src/helper/pricing.json; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/helper/pricing.json
          git commit -m "Update pricing.json from Anthropic's pricing page"
          git push
